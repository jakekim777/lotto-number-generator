<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>로또 번호 자동 생성 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0d0500;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:'Noto Sans KR',sans-serif;}
.page-title{text-align:center;font-size:clamp(22px,5vw,36px);font-weight:900;color:#f5d060;text-shadow:0 0 20px #f5a000,0 2px 0 #8a4500;letter-spacing:2px;margin-bottom:20px;}
.game-wrap{background:#1a0a00;border-radius:24px;border:2px solid #c8860a;overflow:hidden;width:100%;max-width:480px;}
.top-bar{background:#2a1200;border-bottom:2px solid #c8860a;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;}
.avatar{width:38px;height:38px;border-radius:50%;background:#c8860a;border:2px solid #f5d060;display:flex;align-items:center;justify-content:center;font-size:20px;}
.user-name{color:#f5d060;font-size:13px;font-weight:700;}
.lv-bar{width:52px;height:5px;background:#3a2000;border-radius:3px;margin-top:3px;}
.lv-fill{height:5px;border-radius:3px;background:#c8860a;transition:width 0.5s;}
.score-box{text-align:right;}
.score-label{color:#c8860a;font-size:11px;}
.score-val{color:#f5d060;font-size:20px;font-weight:900;}
.stars{color:#f5d060;font-size:14px;}
.sound-btn{background:none;border:none;font-size:20px;cursor:pointer;padding:4px;}
.main-panel{background:#3b0a00;margin:14px;border-radius:16px;border:2px solid #c8860a;padding:20px 14px;}
.panel-title{text-align:center;color:#f5d060;font-size:15px;font-weight:900;letter-spacing:1px;margin-bottom:14px;text-shadow:0 0 8px #f5a000;}
.ball-labels{display:flex;justify-content:center;gap:8px;margin-bottom:5px;}
.ball-label{width:52px;text-align:center;color:#c8860a;font-size:11px;font-weight:700;}
.balls-row{display:flex;justify-content:center;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.lotto-ball{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;border:2px solid rgba(255,255,255,0.25);}
.ball-hidden{background:#5a1a00;color:#3b0a00;border-color:#8a3a00;}
.ball-reveal{animation:pop 0.4s ease both;}
@keyframes pop{0%{transform:scale(0.2);opacity:0;}60%{transform:scale(1.2);}100%{transform:scale(1);opacity:1;}}
.hint-text{text-align:center;color:#c8860a;font-size:12px;margin-bottom:14px;min-height:18px;}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.btn-main{background:#c8860a;color:#1a0a00;border:none;border-radius:30px;padding:12px 26px;font-size:15px;font-weight:900;cursor:pointer;transition:transform 0.1s,background 0.15s;font-family:'Noto Sans KR',sans-serif;}
.btn-main:hover{background:#f5a000;transform:scale(1.04);}
.btn-main:active{transform:scale(0.97);}
.btn-sub{background:#1560a0;color:#b5d4f4;border:2px solid #378add;border-radius:30px;padding:12px 18px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:transform 0.1s;}
.btn-sub:hover{background:#185fa5;}
.btn-sub:active{transform:scale(0.97);}
.section-title{color:#c8860a;font-size:12px;font-weight:700;margin:0 14px 8px;}
.saved-wrap,.multi-wrap{margin:0 14px 14px;display:none;flex-direction:column;gap:7px;}
.saved-row{background:#2a1200;border:1px solid #5a3000;border-radius:10px;display:flex;align-items:center;gap:8px;padding:8px 12px;}
.saved-idx{color:#c8860a;font-size:11px;font-weight:700;min-width:22px;}
.small-ball{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;border:1.5px solid rgba(255,255,255,0.2);}
.multi-label{color:#f5d060;font-size:12px;font-weight:700;min-width:18px;}
.bottom-nav{background:#2a1200;border-top:2px solid #c8860a;display:flex;justify-content:space-around;padding:10px 0;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:#665533;font-size:11px;font-weight:700;cursor:pointer;padding:0 10px;transition:color 0.15s;}
.nav-item.active{color:#f5d060;}
.nav-icon{font-size:22px;}
</style>
</head>
<body>
<div style="width:100%;max-width:480px;">
  <div class="page-title">🎱 로또 번호 자동 생성 게임</div>
  <div class="game-wrap">
    <div class="top-bar">
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="avatar">🎩</div>
        <div>
          <div class="user-name">행운의 도전자</div>
          <div class="lv-bar"><div class="lv-fill" id="lv-fill" style="width:10%;"></div></div>
        </div>
      </div>
      <button class="sound-btn" onclick="toggleSound()" id="sound-btn">🔊</button>
      <div class="score-box">
        <div class="score-label">점수</div>
        <div class="score-val" id="score-val">0</div>
        <div class="stars" id="stars">☆☆☆</div>
      </div>
    </div>

    <div class="main-panel">
      <div class="panel-title">✨ 당신의 행운 번호 ✨</div>
      <div class="ball-labels">
        <div class="ball-label">1번</div><div class="ball-label">2번</div><div class="ball-label">3번</div>
        <div class="ball-label">4번</div><div class="ball-label">5번</div><div class="ball-label">6번</div>
      </div>
      <div class="balls-row" id="balls-row">
        <div class="lotto-ball ball-hidden">?</div>
        <div class="lotto-ball ball-hidden">?</div>
        <div class="lotto-ball ball-hidden">?</div>
        <div class="lotto-ball ball-hidden">?</div>
        <div class="lotto-ball ball-hidden">?</div>
        <div class="lotto-ball ball-hidden">?</div>
      </div>
      <div class="hint-text" id="hint">버튼을 눌러 행운 번호를 뽑아보세요!</div>
      <div class="btn-row">
        <button class="btn-main" onclick="generate()">🎲 행운 번호 생성</button>
        <button class="btn-sub" onclick="saveAndReset()">다시하기 &amp; 저장</button>
      </div>
    </div>

    <div class="section-title" id="saved-title" style="display:none;">📌 저장된 번호</div>
    <div class="saved-wrap" id="saved-wrap"></div>

    <div class="section-title" id="multi-title" style="display:none;">🎰 5게임 자동 생성</div>
    <div class="multi-wrap" id="multi-wrap"></div>

    <div class="bottom-nav">
      <div class="nav-item active" id="tab0" onclick="setTab(0)"><div class="nav-icon">🎟️</div>게임</div>
      <div class="nav-item" id="tab1" onclick="setTab(1)"><div class="nav-icon">📋</div>기록</div>
      <div class="nav-item" id="tab2" onclick="multiGen()"><div class="nav-icon">🎁</div>5게임</div>
      <div class="nav-item" id="tab3" onclick="setTab(3)"><div class="nav-icon">🏆</div>랭킹</div>
    </div>
  </div>
</div>

<script>
let saved=[],current=[],score=0,soundOn=true;

function getBallStyle(n){
  if(n<=10)return{bg:'#FAC775',text:'#633806'};
  if(n<=20)return{bg:'#85B7EB',text:'#042C53'};
  if(n<=30)return{bg:'#F09595',text:'#501313'};
  if(n<=40)return{bg:'#9FE1CB',text:'#04342C'};
  return{bg:'#AFA9EC',text:'#26215C'};
}
function pick(){
  const p=Array.from({length:45},(_,i)=>i+1);
  for(let i=p.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]];}
  return p.slice(0,6).sort((a,b)=>a-b);
}
function renderMainBalls(nums){
  const row=document.getElementById('balls-row');
  row.innerHTML='';
  nums.forEach((n,i)=>{
    const c=getBallStyle(n);
    const d=document.createElement('div');
    d.className='lotto-ball ball-reveal';
    d.style.cssText=`background:${c.bg};color:${c.text};animation-delay:${i*0.08}s;opacity:0;`;
    d.textContent=n;
    row.appendChild(d);
  });
}
function smallBall(n){
  const c=getBallStyle(n);
  return `<div class="small-ball" style="background:${c.bg};color:${c.text};">${n}</div>`;
}
function generate(){
  current=pick();
  renderMainBalls(current);
  score+=100;
  updateScore();
  document.getElementById('hint').textContent='행운의 번호가 생성되었습니다! 저장하려면 다시하기 & 저장을 누르세요.';
}
function saveAndReset(){
  if(!current.length){generate();return;}
  saved.unshift([...current]);
  score+=50;
  updateScore();
  renderSaved();
  current=[];
  document.getElementById('balls-row').innerHTML='<div class="lotto-ball ball-hidden">?</div>'.repeat(6);
  document.getElementById('hint').textContent='저장 완료! 새 번호를 생성해보세요 🎉';
}
function renderSaved(){
  const wrap=document.getElementById('saved-wrap');
  const title=document.getElementById('saved-title');
  if(!saved.length){wrap.style.display='none';title.style.display='none';return;}
  wrap.style.display='flex';title.style.display='block';
  wrap.innerHTML=saved.slice(0,8).map((nums,i)=>
    `<div class="saved-row"><span class="saved-idx">${saved.length-i}회</span>${nums.map(n=>smallBall(n)).join('')}</div>`
  ).join('');
}
function updateScore(){
  document.getElementById('score-val').textContent=score.toLocaleString();
  const lv=Math.min(100,Math.floor(score/20));
  document.getElementById('lv-fill').style.width=lv+'%';
  document.getElementById('stars').textContent=score>=500?'★★★':score>=200?'★★☆':'★☆☆';
}
function multiGen(){
  const games=Array.from({length:5},()=>pick());
  const labels=['A','B','C','D','E'];
  const wrap=document.getElementById('multi-wrap');
  const title=document.getElementById('multi-title');
  wrap.style.display='flex';title.style.display='block';
  wrap.innerHTML=games.map((nums,i)=>
    `<div class="saved-row"><span class="multi-label">${labels[i]}</span>${nums.map(n=>smallBall(n)).join('')}</div>`
  ).join('');
  setTab(2);
}
function setTab(idx){
  [0,1,2,3].forEach(i=>{
    const el=document.getElementById('tab'+i);
    if(el)el.classList.toggle('active',i===idx);
  });
}
function toggleSound(){
  soundOn=!soundOn;
  document.getElementById('sound-btn').textContent=soundOn?'🔊':'🔇';
}
</script>
</body>
</html>
